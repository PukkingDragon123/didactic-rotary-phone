<style>
  :root {
    --ink: #0b0a0f;
    --cabinet: #17151f;

    --ketchup: #c8352b;
    --bone: #e8e0c8;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, var(--cabinet) 0%, var(--ink) 70%);
  }
  canvas#game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    cursor: none;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
  }
</style>

<div id="wrap">

</div>
